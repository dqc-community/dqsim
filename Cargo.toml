[package]
name = "dqsim"
version = "0.1.2"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["blas"] }
nalgebra = "0.33"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_kernels"
harness = false
